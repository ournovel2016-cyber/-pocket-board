function show(gz){
  if(!('DecompressionStream' in window)){err('この端末のブラウザが古いため開けません（iPhoneはiOS 16.4以上）。');return Promise.resolve();}
  return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(function(html){
    document.open();document.write(html);document.close();});
}
function dec(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(P.iv)},key,b64d(P.ct));}
if(!window.crypto||!crypto.subtle){err('この画面は https でしか開けません。');return;}
var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
if(saved){
  crypto.subtle.importKey('raw',b64d(saved),'AES-GCM',false,['decrypt']).then(dec).then(show)
    .catch(function(){try{localStorage.removeItem(KEY);}catch(e){}});
}
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();err('');var btn=document.getElementById('go');btn.disabled=true;btn.textContent='開いています…';
  var pw=document.getElementById('pw').value,key;
  crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
  .then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);})
  .then(function(k){key=k;return dec(k);})
  .then(function(gz){
    if(document.getElementById('rm').checked){return crypto.subtle.exportKey('raw',key).then(function(raw){try{localStorage.setItem(KEY,b64e(raw));}catch(e){}return gz;});}
    return gz;})
  .then(show)
  .catch(function(){err('パスワードが違います。');btn.disabled=false;btn.textContent='開く';});
});
})();
</script></body></html>
