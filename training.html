function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function b64e(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);}

function show(gz){
  if(!('DecompressionStream' in window)){err('この端末のブラウザが古いため開けません（iPhoneはiOS 16.4以上）。');return Promise.resolve();}
